name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate Cursor plugin packaging
        run: node scripts/validate-cursor-plugin.mjs
      - name: Install locked CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Verify Python bootstrap CLI
        run: |
          python -m py_compile sfce.py
          python sfce.py --help
      - name: Skill trigger replay (blocked on fixtures -- U13)
        # STILL NOT EXECUTED, and the reason narrowed to exactly one thing.
        #
        # U13 makes this a blocking check. Two things blocked it; one is now
        # fixed and one is not:
        #
        #   FIXED. The harness compared BARE names from SEED_BATTERY against
        #   the skill identity in a recording. U1 measured that Claude Code
        #   always reports identity plugin-qualified
        #   ("sf-compound-engineering:sf-review"), so every case would have
        #   false-FAILED the moment real fixtures landed. run-test.sh now
        #   strips the qualifier before comparing.
        #
        #   REMAINING. No fixtures are committed. Recording them needs roughly
        #   70 minutes of live CLI time, and one seed case currently shows a
        #   real routing anomaly worth understanding before it is frozen into a
        #   fixture. Switching this on today would fail the build for a missing
        #   recording rather than for a routing regression.
        #
        # The exit-77 tolerance is still NOT restored: a check that cannot fail
        # is worse than one that is visibly switched off.
        run: |
          echo "skill-triggering replay still needs recorded fixtures (see U13)" >&2
      - name: Compounding A/B scoring path
        # The A/B harness's expensive path needs ~12 live CLI turns, so in
        # practice it is run rarely and its output trusted -- which makes every
        # silent bug in the SCORING and REPORTING path a bug that survives.
        # Nobody re-derives a number that took ninety minutes to produce.
        #
        # So the parts that need no model are checked on every commit. This
        # asserts, among 30 checks: a crashed cell is EXCLUDED rather than
        # scored zero (a cell that produced nothing has zero violations in the
        # most misleading sense, and scoring it would make a crash the best
        # available result); a condition that did not take is flagged from the
        # learning count rather than trusted from its label; and a negative
        # result is reported plainly and still exits 0, so the harness cannot
        # become a gate on its own hypothesis being true.
        #
        # It says nothing about whether compounding works. That needs the live
        # runs, which have not been spent -- see
        # docs/solutions/best-practices/measuring-whether-compounding-works.md
        run: |
          python3 tests/compounding/score.py --selftest
          tests/compounding/selftest.sh
      - name: Type-check, test, and lint
        working-directory: cli
        run: |
          bun run typecheck
          bun test
          bun run lint -- ..

  # U10 asked whether to add a macOS leg or downgrade the bash-3.2 claim to a
  # manual pre-release check. Decision: add the leg. The claim that the hook
  # scripts run on macOS system bash 3.2 is load-bearing -- it is the shell
  # every macOS user's hooks actually execute under -- and a claim nothing
  # checks is a claim that quietly stops being true. Linux CI cannot test it:
  # ubuntu-latest ships bash 5.
  hooks-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Record the bash version under test
        run: /bin/bash --version | head -1
      - name: Every hook script parses under system bash 3.2
        run: |
          for s in scripts/sfce-* scripts/session-start; do
            /bin/bash -n "$s" || exit 1
          done
      - name: Install locked CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Hook behaviour and budget tests
        working-directory: cli
        run: bun test tests/hooks/
