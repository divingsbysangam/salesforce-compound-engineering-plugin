name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate Cursor plugin packaging
        run: node scripts/validate-cursor-plugin.mjs
      - name: Install locked CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Verify Python bootstrap CLI
        run: |
          python -m py_compile sfce.py
          python sfce.py --help
      - name: Skill-triggering eval gate
        # NOW EXECUTED. This replaces the `echo` that stood here through U13,
        # and it is a real blocking check rather than a narrated one.
        #
        # ci.sh runs two phases and owns the policy for the second:
        #
        #   phase 1  The assertion-engine selftest. Sixteen synthetic streams
        #            fed to the real assertions in run-test.sh, covering every
        #            failure mode the harness documents — wrong skill,
        #            near-match name, another plugin's same-named skill, the
        #            expected skill reached second, a premature Bash/Edit, a
        #            truncated fixture, a missing one. No CLI, no network, no
        #            fixtures. Always blocking. This is what closes U13: there
        #            is now a step here that can go red.
        #
        #   phase 2  The recorded battery, which ARMS ITSELF from the fixtures
        #            on disk: 0 of 10 passes with a loud UNARMED notice, 1..9
        #            FAILS as a partial recording, 10 of 10 makes the battery's
        #            verdict the build's. No flag to flip, and recording three
        #            easy cases cannot buy a green gate.
        #
        # Why phase 2 may still pass with nothing recorded: the ~70 minutes of
        # live CLI time is only time, but one seed case shows a genuine routing
        # anomaly and a fixture is a single sample — freezing the wrong run
        # would create a permanent false failure or permanent false confidence.
        # See tests/skill-triggering/fixtures/README.md.
        #
        # The exit-77 tolerance is still NOT restored anywhere.
        run: tests/skill-triggering/ci.sh
      - name: Compounding A/B scoring path
        # The A/B harness's expensive path needs ~12 live CLI turns, so in
        # practice it is run rarely and its output trusted -- which makes every
        # silent bug in the SCORING and REPORTING path a bug that survives.
        # Nobody re-derives a number that took ninety minutes to produce.
        #
        # So the parts that need no model are checked on every commit. This
        # asserts, among 50 checks: a crashed cell is EXCLUDED rather than
        # scored -- driven through the real run-ab.sh with a stub `claude` that
        # exits 1, and one that exits 0 without touching the seed, since an
        # untouched seed would otherwise score as a "legitimate" null; neither
        # arm's clone can reach removed learnings or the scorer through git
        # history; a condition that did not take is excluded from the total,
        # judged by the learning count rather than the label; --score-only
        # re-scores rather than trusting stored numbers; and a negative result
        # is reported plainly and still exits 0, so the harness cannot become a
        # gate on its own hypothesis being true.
        #
        # It says nothing about whether compounding works. That needs the live
        # runs, which have not been spent -- see
        # docs/solutions/best-practices/measuring-whether-compounding-works.md
        run: |
          python3 tests/compounding/score.py --selftest
          tests/compounding/selftest.sh
      - name: Type-check, test, and lint
        working-directory: cli
        run: |
          bun run typecheck
          bun test
          bun run lint -- ..

  # U10 asked whether to add a macOS leg or downgrade the bash-3.2 claim to a
  # manual pre-release check. Decision: add the leg. The claim that the hook
  # scripts run on macOS system bash 3.2 is load-bearing -- it is the shell
  # every macOS user's hooks actually execute under -- and a claim nothing
  # checks is a claim that quietly stops being true. Linux CI cannot test it:
  # ubuntu-latest ships bash 5.
  hooks-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Record the bash version under test
        run: /bin/bash --version | head -1
      - name: Every hook script parses under system bash 3.2
        run: |
          for s in scripts/sfce-* scripts/session-start; do
            /bin/bash -n "$s" || exit 1
          done
      - name: Every eval-harness script parses under system bash 3.2
        # The harness documents bash 3.2 support deliberately (no mapfile, no
        # associative arrays, no case-modification expansion) because the people
        # recording fixtures do so on macOS, where /bin/bash is 3.2. ubuntu-latest
        # ships bash 5 and would accept a bash-4 construct silently, so the claim
        # has to be checked on this leg or it is not checked at all.
        run: |
          for s in tests/skill-triggering/*.sh; do
            /bin/bash -n "$s" || exit 1
          done
      - name: Assertion-engine selftest under system bash 3.2
        # Parsing is not the property that matters. The selftest runs the real
        # assertions against sixteen synthetic streams, so running it here proves
        # the engine BEHAVES the same under 3.2 as under the bash 5 on the Linux
        # leg -- which is the shell every recording session actually uses.
        run: tests/skill-triggering/selftest.sh
      - name: Install locked CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Hook behaviour and budget tests
        working-directory: cli
        run: bun test tests/hooks/
