name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate Cursor plugin packaging
        run: node scripts/validate-cursor-plugin.mjs
      - name: Install locked CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Verify Python bootstrap CLI
        run: |
          python -m py_compile sfce.py
          python sfce.py --help
      - name: Verify skill trigger fixtures
        run: |
          set +e
          bash tests/skill-triggering/run-test.sh
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 77 ]; then exit "$status"; fi
      - name: Type-check, test, and lint
        working-directory: cli
        run: |
          bun run typecheck
          bun test
          bun run lint -- ..
