    <ellipse cx="175" cy="260" rx="85" ry="70" fill="#90D0FE"/>
    <ellipse cx="250" cy="230" rx="90" ry="80" fill="#90D0FE"/>
    <ellipse cx="340" cy="260" rx="80" ry="70" fill="#90D0FE"/>
    <ellipse cx="200" cy="345" rx="90" ry="75" fill="#FFFFFF"/>
    <ellipse cx="285" cy="320" rx="95" ry="80" fill="#FFFFFF"/>
    <ellipse cx="375" cy="345" rx="75" ry="75" fill="#FFFFFF"/>
  </g>
  <circle cx="345" cy="155" r="45" fill="#FFFFFF"/>
  <circle cx="345" cy="155" r="23" fill="#00A1E0"/>
</svg>
